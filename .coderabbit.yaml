# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "draft"
    drafts: false
    base_branches:
      - "master"
      - "main"
  path_filters:
    - "!website_full_tour.*"
    - "!videos/**"
    - "!backups/**"
    - "!archive/**"
    - "!venv/**"
    - "!node_modules/**"
    - "!**/package-lock.json"
    - "!**/*.mp4"
    - "!**/*.webm"
    - "!**/*.webp"
    - "!**/*.svg"
  tools:
    ast-grep:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    eslint:
      enabled: true
    biome:
      enabled: false
chat:
  auto_reply: true
