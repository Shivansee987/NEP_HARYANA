# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
#
# Release gate (FIN-08): nothing is deployed unless the backend tests, migration and production-settings checks,
# and the frontend tests, lint gate, production build and bundle credential scan all pass on the same commit.
# Pull requests run the checks only; only master is ever deployed.
# Manual approval: add `environment: production` to the deploy job and configure required reviewers in GitHub
# (Settings -> Environments) AFTER adding a matching federated credential (subject environment:production) to the
# Azure app registration; otherwise azure/login's OIDC subject no longer matches and the deploy cannot log in.

name: Build and deploy Python app to Azure Web App - nep-excellence

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: nep-excellence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.ci

      - name: Production settings pass the deployment checklist
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: ci.invalid
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level ERROR

      - name: Backend test suite
        run: python manage.py test apps --settings=config.settings.ci --noinput

  frontend-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Frontend/NEP_HARYANA_INT
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Frontend/NEP_HARYANA_INT/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests (all files)
        run: npm test

      - name: Lint gate (undefined identifiers, broken hooks)
        run: npm run lint:gate

      - name: Production build
        run: npm run build

      - name: No development credentials in the bundle
        run: npm run check:bundle

  build:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment and install dependencies
        working-directory: ./Backend
        run: |
          python -m venv ../antenv
          source ../antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            Backend
            !antenv/
            !Backend/db.sqlite3
            !Backend/media/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FB2D8701D3F746B392B04A19BC84D28F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D41E8DDDB3714233A074C459EB076B7C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A00E84385DD840E998AF2085CDC253E5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: nep-excellence
          slot-name: Production
